server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Coolify/Traefik termina el HTTPS; las redirecciones de nginx no deben apuntar al puerto interno
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

  # Archivos con hash de Astro: caché larga e inmutable
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Una sola URL por página: /ruta/index.html y /ruta (sin extensión) redirigen a /ruta/
  if ($request_uri ~ ^([^?]*/)index\.html(\?.*)?$) {
    return 301 $1$2;
  }

  # Páginas: siempre se revalidan para que cada despliegue se vea al instante
  location / {
    rewrite ^(/[^.]*[^/])$ $1/ permanent;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    include /etc/nginx/snippets/security-headers.conf;
    internal;
  }
}
