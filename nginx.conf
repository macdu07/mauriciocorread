server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Coolify/Traefik termina el HTTPS; las redirecciones de nginx no deben apuntar al puerto interno
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Archivos con hash de Astro: caché larga e inmutable
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Páginas: siempre se revalidan para que cada despliegue se vea al instante
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
