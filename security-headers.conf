# Cabeceras de seguridad. Se incluye en cada location de nginx.conf porque
# un add_header dentro de un location anula todos los heredados del server.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CSP en modo solo informe: avisa en consola sin bloquear nada. Los hashes son
# los de los dos scripts inline (preloader y data-text-roll) y cambian si se
# edita su texto. Pasar a Content-Security-Policy cuando la consola esté limpia.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-jvtJar//ukoRIAryPFkmoIRuRzIchl8TYbFssP5MQ4o=' 'sha256-9RrNIT+eEj/MmrYQffOqxZtT5rb1gUs0dFq/u6qKXbs='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
